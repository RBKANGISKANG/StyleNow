name: Deploy web app to GitHub Pages

on:
  push:
    branches: [claude/interactive-stylish-app-design-1mxyn4, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # GitHub Pages needs a public repo on the free plan — the job skips
    # cleanly while the repo is private and activates the moment it is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install
        run: npm ci

      - name: Domain tests
        run: npm test

      - name: Build static export
        working-directory: apps/web
        env:
          STATIC_EXPORT: '1'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BACKEND: local
        run: |
          # API routes don't exist in a static export — the client runs the
          # same engine in-browser (Supabase-backed when configured).
          rm -rf src/app/api
          npx next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
