name: Deploy web app to GitHub Pages

# Publishes by pushing the static export to the gh-pages branch — GitHub
# serves it automatically. This route needs no Pages API access, which the
# workflow token does not have (site creation via actions/configure-pages
# consistently fails with "Resource not accessible by integration").

on:
  push:
    branches: [claude/interactive-stylish-app-design-1mxyn4, main]
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Domain tests
        run: npm test

      - name: Build static export
        working-directory: apps/web
        env:
          STATIC_EXPORT: '1'
          PAGES_BASE_PATH: /StyleNow
          NEXT_PUBLIC_BACKEND: local
        run: |
          # API routes don't exist in a static export — the client runs the
          # same engine in-browser (Supabase-backed when configured).
          rm -rf src/app/api
          npx next build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/out
          force_orphan: true
